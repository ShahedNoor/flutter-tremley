name: tremley_cutomer
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+3
# Current Apple build version: 1.0.0+3
# Current Google Play build version: 1.0.0+7

environment:
  sdk: '>=3.4.4 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  auto_animated: ^3.2.0
  get_storage: ^2.1.1
  # get: ^4.7.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  dotlottie_loader: ^0.0.5
  lottie: ^3.3.1
  rxdart: ^0.28.0
  dio: ^5.8.0+1
  get_it: ^9.2.0
  http: ^1.6.0
  cached_network_image: ^3.4.1
  get: ^4.7.3
  video_player: ^2.11.1
  dotted_border: ^2.1.0
  google_maps_flutter: ^2.17.0
  apple_maps_flutter: ^1.4.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  pinput: ^5.0.0
  image_picker: ^1.2.2
  shimmer: ^3.0.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.3.0
  device_info_plus: ^13.1.0
  flutter_local_notifications: ^21.0.0
  dart_pusher_channels: ^1.3.1
  pretty_qr_code: ^3.6.0
  qr_flutter: ^4.1.0
  vibration: ^3.2.0
  app_links: ^7.1.2
  permission_handler: ^13.0.2




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner:
  flutter_gen_runner:
  mocktail: ^1.0.4

flutter_gen:
  output: lib/gen/ 
  line_length: 80

    # Optional
  integrations:


  colors:
    inputs:
      - assets/color/colors.xml

    outputs:
      class_name: AppColors
  
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/lottie/
    - assets/images/
    - assets/videos/
  
  fonts:
    - family: DMSans
      fonts:
        - asset:  assets/fonts/DMSans-Regular.ttf
  
    - family: Open Sans
      fonts:
        - asset:  assets/fonts/OpenSans-Regular.ttf

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight-VariableFont_wght.ttf
        - asset: assets/fonts/InterTight-Italic-VariableFont_wght.ttf
          style: italic

    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont_wght.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-VariableFont_wght.ttf
          style: italic

    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-VariableFont_wght.ttf
          style: italic

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/Roboto-Italic-VariableFont_wdth,wght.ttf
          style: italic

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
